name: GEO atlas (ALS / FTD / AD)

# Downloads the public GEO cohorts in sphingomap_cns/registry.py, runs the full
# atlas and commits the reports + figures to results/atlas. Run it from the
# Actions tab ("Run workflow"); optionally name specific GEO accessions.
on:
  workflow_dispatch:
    inputs:
      cohorts:
        description: "GEO accessions separated by spaces (blank = all default cohorts)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Cache GEO downloads
        uses: actions/cache@v4
        with:
          path: data/raw
          key: geo-v2-${{ hashFiles('sphingomap_cns/registry.py') }}
          restore-keys: geo-v2-
      - name: Inspect sample annotations (audit trail for group assignment)
        continue-on-error: true
        env:
          COHORTS: ${{ github.event.inputs.cohorts }}
        run: |
          rm -rf results/atlas && mkdir -p results/atlas
          for c in ${COHORTS:-GSE153960 GSE5281 GSE112676 GSE112680}; do
            echo "::group::$c"
            sphingomap-cns inspect "$c" --datadir data/raw | tee "results/atlas/INSPECT_$c.txt"
            echo "::endgroup::"
          done
      - name: Build atlas
        env:
          COHORTS: ${{ github.event.inputs.cohorts }}
        run: sphingomap-cns atlas $COHORTS --datadir data/raw -o results/atlas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sphingomap-cns-atlas
          path: results/atlas
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/atlas
          git diff --cached --quiet || git commit -m "Update GEO atlas results [skip ci]"
          git push
